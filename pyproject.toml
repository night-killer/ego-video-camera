[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-video-camera"
version = "0.1.0"
description = "Manual egocentric camera authoring, Gaussian rendering, and DA3 pose comparison"
requires-python = ">=3.10"
dependencies = [
  "av>=14",
  "fastapi>=0.115",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pillow>=10",
  "plyfile>=1.1",
  "pydantic>=2.10",
  "scipy>=1.14",
  "torch>=2.5",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
gpu = ["gsplat>=1.5", "safetensors>=0.5"]
test = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["ego_video_camera*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires an NVIDIA CUDA device and a working gsplat extension",
  "integration: uses external sample assets",
]

