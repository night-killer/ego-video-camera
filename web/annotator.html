<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Egocentric Camera Annotator</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1114; --panel:#181d22; --line:#313a42; --text:#eef3f5; --muted:#9ba8b0; --accent:#44c7a2; --danger:#ff6969; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,sans-serif; }
    body { display:grid; grid-template-columns:340px 1fr; }
    aside { min-width:0; overflow:auto; background:var(--panel); border-right:1px solid var(--line); padding:16px; }
    main { position:relative; min-width:0; }
    canvas { display:block; width:100%; height:100%; }
    h1 { font-size:18px; margin:0 0 4px; }
    .muted { color:var(--muted); font-size:12px; }
    section { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
    h2 { font-size:13px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.06em; color:#c8d2d7; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label { display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:12px; }
    input, button { height:34px; border:1px solid var(--line); border-radius:6px; background:#222930; color:var(--text); padding:0 9px; font:inherit; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button.primary { background:#176e5b; border-color:#278e76; }
    button.danger:hover { border-color:var(--danger); }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:9px; }
    .wide { grid-column:1 / -1; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px; }
    th, td { border-bottom:1px solid #293138; padding:6px 4px; text-align:left; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#212a30; }
    tbody tr.selected { background:#17483d; }
    td input { width:100%; height:28px; padding:0 5px; }
    #status { margin-top:12px; padding:9px; min-height:38px; border:1px solid var(--line); border-radius:6px; color:var(--muted); overflow-wrap:anywhere; }
    #status.error { color:#ff9b9b; border-color:#713a3a; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; background:#0d1115; color:#ced8dc; font-size:16px; }
    #hud { position:absolute; right:12px; top:12px; padding:8px 10px; border-radius:6px; background:#0b0e11cc; color:#c7d2d8; font-size:12px; pointer-events:none; }
    @media (max-width:850px) { body { grid-template-columns:1fr; grid-template-rows:330px 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"/vendor/three/build/three.module.js",
      "three/addons/":"/vendor/three/examples/jsm/",
      "@sparkjsdev/spark":"/vendor/spark/dist/spark.module.js"
    }}
  </script>
</head>
<body>
  <aside>
    <h1>Egocentric Camera Annotator</h1>
    <div class="muted" id="scene-label">正在读取场景…</div>

    <section>
      <h2>视频相机</h2>
      <div class="grid">
        <label>宽度<input id="width" type="number" min="2" step="2" value="896"></label>
        <label>高度<input id="height" type="number" min="2" step="2" value="504"></label>
        <label>FPS<input id="fps" type="number" min="1" max="240" step="1" value="15"></label>
        <label>垂直 FOV<input id="fov" type="number" min="1" max="179" step="0.1" value="65"></label>
      </div>
    </section>

    <section>
      <h2>关键帧</h2>
      <table>
        <thead><tr><th style="width:25%">顺序</th><th style="width:32%">帧号</th><th>时间 (s)</th></tr></thead>
        <tbody id="keyframe-rows"></tbody>
      </table>
      <div class="buttons">
        <button id="add" class="primary">添加当前视角</button>
        <button id="replace">替换选中</button>
        <button id="up">前移</button>
        <button id="down">后移</button>
        <button id="delete" class="danger">删除</button>
        <button id="reset">回到初始视角</button>
        <button id="save" class="primary wide">保存关键帧 JSON</button>
      </div>
      <div id="status">鼠标拖动旋转，滚轮前后移动；WASD/方向键移动，Shift 加速。</div>
    </section>
  </aside>
  <main id="viewport">
    <div id="loading">正在加载 Gaussian 场景…</div>
    <div id="hud">单击表格行可跳转到对应相机</div>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { SparkControls, SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const config = await fetch("/api/config").then((response) => {
      if (!response.ok) throw new Error(`配置读取失败：${response.status}`);
      return response.json();
    });
    const viewport = document.getElementById("viewport");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const rows = document.getElementById("keyframe-rows");
    const widthInput = document.getElementById("width");
    const heightInput = document.getElementById("height");
    const fpsInput = document.getElementById("fps");
    const fovInput = document.getElementById("fov");
    document.getElementById("scene-label").textContent = `${config.scene.scene_id} · ${config.asset_kind.toUpperCase()} · ${config.output_path}`;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1115);
    const camera = new THREE.PerspectiveCamera(65, 1, 0.005, 100000);
    const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.style.position = "absolute";
    viewport.appendChild(renderer.domElement);
    const spark = new SparkRenderer({ renderer, accumExtSplats:true, preBlurAmount:0.3, blurAmount:0, sortRadial:true, encodeLinear:false });
    scene.add(spark);
    const controls = new SparkControls({ canvas:renderer.domElement });
    const previewGroup = new THREE.Group();
    scene.add(previewGroup);
    const radius = Number.isFinite(config.camera_radius) ? config.camera_radius : 10;
    const grid = new THREE.GridHelper(Math.max(radius * 1.5, 4), 20, 0x41505a, 0x263139);
    scene.add(grid);

    const displayFromPly = matrixFromRows(config.scene.display_from_ply);
    const plyFromDisplay = displayFromPly.clone().invert();
    const rdfToThree = new THREE.Matrix4().makeScale(1, -1, -1);
    let keyframes = [];
    let selectedId = null;
    let nextId = 1;

    function matrixFromRows(rowsValue) {
      return new THREE.Matrix4().set(...rowsValue.flat());
    }
    function matrixToRows(matrix) {
      const e = matrix.elements;
      return Array.from({length:4}, (_, row) => Array.from({length:4}, (_, column) => e[column * 4 + row]));
    }
    function numberValue(input, fallback) {
      const value = Number(input.value);
      return Number.isFinite(value) ? value : fallback;
    }
    function videoSettings() {
      return {
        width:Math.max(2, Math.round(numberValue(widthInput, 896) / 2) * 2),
        height:Math.max(2, Math.round(numberValue(heightInput, 504) / 2) * 2),
        fps:Math.max(1, numberValue(fpsInput, 15)),
        fov_y_degrees:Math.min(179, Math.max(1, numberValue(fovInput, 65))),
      };
    }
    function intrinsics() {
      const video = videoSettings();
      const focal = 0.5 * video.height / Math.tan(THREE.MathUtils.degToRad(video.fov_y_degrees) * 0.5);
      return [[focal,0,video.width*0.5],[0,focal,video.height*0.5],[0,0,1]];
    }
    function currentCanonicalPose() {
      camera.updateMatrixWorld(true);
      const canonical = plyFromDisplay.clone().multiply(camera.matrixWorld).multiply(rdfToThree);
      return matrixToRows(canonical);
    }
    function applyCanonicalPose(rowsValue) {
      const displayMatrix = displayFromPly.clone().multiply(matrixFromRows(rowsValue)).multiply(rdfToThree);
      displayMatrix.decompose(camera.position, camera.quaternion, camera.scale);
      controls.pointerControls.rotateVelocity.set(0,0,0);
      controls.pointerControls.moveVelocity.set(0,0,0);
      camera.updateMatrixWorld(true);
    }
    function setMessage(message, error=false) {
      status.textContent = message;
      status.classList.toggle("error", error);
    }
    function initialView() {
      const initial = config.initial_camera;
      camera.position.fromArray(initial.position);
      camera.up.fromArray(initial.up).normalize();
      camera.lookAt(new THREE.Vector3().fromArray(initial.target));
      camera.fov = Number(initial.fov_y_degrees);
      fovInput.value = camera.fov.toFixed(3).replace(/\.0+$/, "");
      camera.updateProjectionMatrix();
      controls.pointerControls.rotateVelocity.set(0,0,0);
      controls.pointerControls.moveVelocity.set(0,0,0);
      camera.updateMatrixWorld(true);
    }
    function sortedFrames() {
      return [...keyframes].sort((a,b) => a.frameIndex - b.frameIndex);
    }
    function addCurrent() {
      const sorted = sortedFrames();
      const fps = videoSettings().fps;
      const frameIndex = sorted.length ? sorted.at(-1).frameIndex + Math.round(fps) : 0;
      const item = { id:nextId++, frameIndex, cameraToWorld:currentCanonicalPose() };
      keyframes.push(item);
      selectedId = item.id;
      renderTable();
      updatePreview();
      setMessage(`已添加第 ${keyframes.length} 个关键帧。`);
    }
    function selectedIndex() { return keyframes.findIndex((item) => item.id === selectedId); }
    function replaceSelected() {
      const index = selectedIndex();
      if (index < 0) return setMessage("请先选中一个关键帧。", true);
      keyframes[index].cameraToWorld = currentCanonicalPose();
      updatePreview();
      setMessage("已用当前视角替换选中关键帧。未保存到磁盘。 ");
    }
    function deleteSelected() {
      const index = selectedIndex();
      if (index < 0) return setMessage("请先选中一个关键帧。", true);
      keyframes.splice(index, 1);
      selectedId = keyframes[index]?.id ?? keyframes[index - 1]?.id ?? null;
      renderTable();
      updatePreview();
    }
    function moveSelected(direction) {
      const sorted = sortedFrames();
      const index = sorted.findIndex((item) => item.id === selectedId);
      const other = index + direction;
      if (index < 0 || other < 0 || other >= sorted.length) return;
      const timestamp = sorted[index].frameIndex;
      sorted[index].frameIndex = sorted[other].frameIndex;
      sorted[other].frameIndex = timestamp;
      renderTable();
      updatePreview();
    }
    function renderTable() {
      rows.replaceChildren();
      const fps = videoSettings().fps;
      sortedFrames().forEach((item, order) => {
        const row = document.createElement("tr");
        row.classList.toggle("selected", item.id === selectedId);
        const orderCell = document.createElement("td");
        orderCell.textContent = String(order + 1);
        const frameCell = document.createElement("td");
        const frameInput = document.createElement("input");
        frameInput.type = "number"; frameInput.min = "0"; frameInput.step = "1"; frameInput.value = String(item.frameIndex);
        frameInput.addEventListener("click", (event) => event.stopPropagation());
        frameInput.addEventListener("change", () => {
          item.frameIndex = Math.max(0, Math.round(Number(frameInput.value) || 0));
          renderTable(); updatePreview();
        });
        frameCell.appendChild(frameInput);
        const timeCell = document.createElement("td");
        const timeInput = document.createElement("input");
        timeInput.type = "number"; timeInput.min = "0"; timeInput.step = String(1 / fps); timeInput.value = (item.frameIndex / fps).toFixed(3);
        timeInput.addEventListener("click", (event) => event.stopPropagation());
        timeInput.addEventListener("change", () => {
          item.frameIndex = Math.max(0, Math.round((Number(timeInput.value) || 0) * videoSettings().fps));
          renderTable(); updatePreview();
        });
        timeCell.appendChild(timeInput);
        row.append(orderCell, frameCell, timeCell);
        row.addEventListener("click", () => { selectedId = item.id; applyCanonicalPose(item.cameraToWorld); renderTable(); });
        rows.appendChild(row);
      });
    }
    function clearPreview() {
      while (previewGroup.children.length) {
        const child = previewGroup.children[previewGroup.children.length - 1];
        previewGroup.remove(child);
        child.geometry?.dispose(); child.material?.dispose();
      }
    }
    function addPreviewLines(points, indices, color, opacity=1) {
      const positions = [];
      indices.forEach(([a,b]) => positions.push(...points[a].toArray(), ...points[b].toArray()));
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({ color, transparent:opacity < 1, opacity, depthTest:false });
      const lines = new THREE.LineSegments(geometry, material); lines.renderOrder = 10; previewGroup.add(lines);
    }
    function previewFrustum(item, color) {
      const video = videoSettings(); const K = intrinsics(); const depth = Math.max(radius * 0.025, 0.05);
      const fx=K[0][0], fy=K[1][1], cx=K[0][2], cy=K[1][2];
      const local = [new THREE.Vector3(0,0,0)];
      [[0,0],[video.width,0],[video.width,video.height],[0,video.height]].forEach(([u,v]) => local.push(new THREE.Vector3((u-cx)/fx*depth,(v-cy)/fy*depth,depth)));
      const displayMatrix = displayFromPly.clone().multiply(matrixFromRows(item.cameraToWorld));
      local.forEach((point) => point.applyMatrix4(displayMatrix));
      addPreviewLines(local, [[0,1],[0,2],[0,3],[0,4],[1,2],[2,3],[3,4],[4,1]], color, 0.9);
    }
    function updatePreview() {
      clearPreview();
      const sorted = sortedFrames();
      sorted.forEach((item) => previewFrustum(item, item.id === selectedId ? 0xffd166 : 0x51d5b0));
      if (sorted.length > 1) {
        const points = sorted.map((item) => {
          const matrix = displayFromPly.clone().multiply(matrixFromRows(item.cameraToWorld));
          return new THREE.Vector3().setFromMatrixPosition(matrix);
        });
        addPreviewLines(points, points.slice(1).map((_, index) => [index,index+1]), 0x64a8ff, 0.9);
      }
    }
    async function save() {
      const sorted = sortedFrames(); const video = videoSettings();
      if (sorted.length < 2) return setMessage("至少需要两个关键帧。", true);
      if (sorted[0].frameIndex !== 0) return setMessage("第一个关键帧的帧号必须是 0。", true);
      if (new Set(sorted.map((item) => item.frameIndex)).size !== sorted.length) return setMessage("关键帧帧号必须严格递增且不能重复。", true);
      const K = intrinsics();
      const payload = {
        schema_version:"camera_trajectory.v1", trajectory_type:"keyframes",
        coordinate_system:"supersplat_source_ply_world", camera_axes:"opencv_rdf_x_right_y_down_z_forward",
        scene:config.scene, video,
        frames:sorted.map((item) => ({ frame_index:item.frameIndex, timestamp_seconds:item.frameIndex/video.fps, camera_to_world:item.cameraToWorld, K })),
        source:{ authoring_tool:"browser_spark_keyframe_annotator", display_asset_kind:config.asset_kind }
      };
      setMessage("正在保存…");
      const response = await fetch("/api/save", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
      const result = await response.json();
      if (!response.ok) return setMessage(`保存失败：${typeof result.detail === "string" ? result.detail : JSON.stringify(result.detail)}`, true);
      setMessage(`已保存 ${result.keyframe_count} 个关键帧到 ${result.output_path}`);
    }
    function loadSaved(saved) {
      if (!saved) return;
      widthInput.value=saved.video.width; heightInput.value=saved.video.height; fpsInput.value=saved.video.fps;
      camera.fov=saved.video.fov_y_degrees ?? config.initial_camera.fov_y_degrees;
      fovInput.value=camera.fov; camera.updateProjectionMatrix();
      keyframes = saved.frames.map((frame) => ({ id:nextId++, frameIndex:frame.frame_index, cameraToWorld:frame.camera_to_world }));
      selectedId = keyframes[0]?.id ?? null;
      if (keyframes.length) applyCanonicalPose(keyframes[0].cameraToWorld);
      renderTable(); updatePreview();
    }
    function resize() {
      const availableWidth=Math.max(1,viewport.clientWidth), availableHeight=Math.max(1,viewport.clientHeight);
      const video=videoSettings(), targetAspect=video.width/video.height;
      let width=availableWidth, height=Math.round(width/targetAspect);
      if (height > availableHeight) { height=availableHeight; width=Math.round(height*targetAspect); }
      renderer.domElement.style.left=`${Math.floor((availableWidth-width)/2)}px`;
      renderer.domElement.style.top=`${Math.floor((availableHeight-height)/2)}px`;
      renderer.domElement.style.width=`${width}px`; renderer.domElement.style.height=`${height}px`;
      renderer.setSize(width,height,false); camera.aspect=targetAspect; camera.updateProjectionMatrix();
    }
    document.getElementById("add").addEventListener("click", addCurrent);
    document.getElementById("replace").addEventListener("click", replaceSelected);
    document.getElementById("delete").addEventListener("click", deleteSelected);
    document.getElementById("up").addEventListener("click", () => moveSelected(-1));
    document.getElementById("down").addEventListener("click", () => moveSelected(1));
    document.getElementById("reset").addEventListener("click", initialView);
    document.getElementById("save").addEventListener("click", () => void save());
    [widthInput,heightInput,fpsInput].forEach((input) => input.addEventListener("change", () => { resize(); renderTable(); updatePreview(); }));
    fovInput.addEventListener("change", () => { camera.fov=videoSettings().fov_y_degrees; camera.updateProjectionMatrix(); updatePreview(); });
    window.addEventListener("resize", resize);

    initialView(); loadSaved(config.saved_trajectory); resize();
    const splat = new SplatMesh({ url:new URL(config.asset_url,location.href).href, extSplats:true });
    scene.add(splat);
    try { await splat.initialized; loading.remove(); setMessage(config.saved_trajectory ? "已恢复现有关键帧；修改后请重新保存。" : "场景已加载，可以开始添加关键帧。"); }
    catch (error) { loading.textContent=`场景加载失败：${error.message || error}`; setMessage(loading.textContent,true); }
    renderer.setAnimationLoop(() => { controls.update(camera); renderer.render(scene,camera); });
  </script>
</body>
</html>
